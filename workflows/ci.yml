name: CI Bookmarked Backend

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          JWT_SECRET: test_secret_key_for_ci_purposes_only
          jwtExpiresIn: 1h
          NODE_ENV: test
        run: npm test