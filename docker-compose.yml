services:
  api:
    build: .
    container_name: bookmarked-Backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: aqwAQW123
      jwtExpiresIn: 1h
      MONGO_URI: mongodb://admin:password123@mongodb:27017/bookmarked?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:7
    container_name: bookmarked-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: bookmarked
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:


